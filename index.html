<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>eCon Versiebeheer</title>
    <link rel="icon" href="/brand/icon.ico" sizes="32x32" />
    <link rel="icon" href="/brand/icon.svg" type="image/svg+xml" />
    <!-- Het thema staat op <html> vóór de eerste paint, anders flitst het
         verkeerde thema. Zelfde drie standen als src/lib/theme.js. -->
    <script>
      try {
        var t = localStorage.getItem('econVersiebeheer.theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
